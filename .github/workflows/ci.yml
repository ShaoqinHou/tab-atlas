name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tab-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check -e . ruff==0.14.11
      - run: python -m ruff format --check tabatlas scripts tests
      - run: python -m ruff check tabatlas scripts tests
      - run: python -m compileall -q tabatlas scripts
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/extension_protocol.test.mjs
      - run: find assets/extension assets/report -name '*.js' -print0 | xargs -0 -n1 node --check
