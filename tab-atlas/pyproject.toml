[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabatlas"
version = "0.1.0"
description = "Local Codex-assisted durable browser tab library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tabatlas = "tabatlas.commandline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tabatlas*"]
