<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TabAtlas</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div><h1>TabAtlas</h1><p>Save the useful web. Close the clutter with confidence.</p></div><div class="top-actions"><button id="syncBtn">Sync paired browsers</button><button id="organizeBtn" class="primary">Organize visible</button></div></header>
<main>
<section class="summary" id="summary"></section>
<section class="toolbar"><input id="search" placeholder="Search titles, URLs, and your notes"><select id="state"><option value="">All organization states</option><option value="pending">Needs organization</option><option value="suggestion_ready">Suggestion ready</option><option value="organized">Organized</option></select><select id="type"><option value="">All content</option><option value="web">Articles & web</option><option value="video">Video</option><option value="social">Social</option><option value="image">Images</option></select><button id="selectVisible">Select visible</button></section>
<div class="layout"><aside><h2>Collections</h2><nav id="collections"></nav><hr><button id="pairChrome">Pair Chrome</button><button id="pairEdge">Pair Edge</button><div id="runtime" class="runtime"></div></aside>
<section class="content"><div class="scopebar"><span id="scopeText">0 selected</span><button id="applyBtn">Apply suggestions</button><button id="wholeBtn">Reconsider whole library</button></div><div id="status" class="status"></div><div id="grid" class="grid"></div><div class="pager"><button id="moreBtn">Load more</button></div></section></div>
</main><dialog id="detail"><button class="close" onclick="this.closest('dialog').close()">×</button><div id="detailBody"></div></dialog><script type="module" src="/app.js"></script></body></html>
